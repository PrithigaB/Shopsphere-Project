
{% extends 'main.html' %}

{% block content %}
<center>
    <h1>Forgot Password</h1>
</center>

<center>
<form method="post" class="auth-form">
    {% csrf_token %}

    <h2>Reset Your Password</h2>

    <input 
        type="text" 
        name="username" 
        placeholder="Enter your username" 
        required
    >

    <button type="submit">Next</button>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <br>
    <a href="{% url 'login_' %}">Back to Login</a>
</form>
</center>
{% endblock %}
